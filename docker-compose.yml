
services:
  #database section
  tripdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks:
      - swiftride-network

  identitydb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks:
      - swiftride-network

  paymentdb:
    image: postgres:latest
    networks:
      - swiftride-network

  matchingdb:
    image: mongo:latest
    networks:
      - swiftride-network

  #infrastructure section
  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - swiftride-network

  #observability section
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: swiftride-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger Web UI
      - "4317:4317"     # OTLP gRPC receiver (dùng cho Matching.API / OpenTelemetry)
      - "4318:4318"     # OTLP HTTP receiver
    networks:
      - swiftride-network

  loki:
    image: grafana/loki:latest
    container_name: swiftride-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - swiftride-network

  grafana:
    image: grafana/grafana:latest
    container_name: swiftride-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - jaeger
    networks:
      - swiftride-network

  #microservice api section
  identity.api:
    image: ${DOCKER_REGISTRY-}identity-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    networks:
      - swiftride-network

  trip.api:
    image: ${DOCKER_REGISTRY-}trip-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Trip/Trip.API/Dockerfile
    networks:
      - swiftride-network

  payment.api:
    image: ${DOCKER_REGISTRY-}payment-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.API/Dockerfile
    networks:
      - swiftride-network

  matching.api:
    image: ${DOCKER_REGISTRY-}matching-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Matching/Matching.API/Dockerfile
    networks:
      - swiftride-network

  notification.api:
    image: ${DOCKER_REGISTRY-}notification-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    networks:
      - swiftride-network

  yarpapigw:
    image: ${DOCKER_REGISTRY-}yarpapigw:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: src/ApiGateways/YARPAPiGw/Dockerfile
    networks:
      - swiftride-network

networks:
  swiftride-network:
    driver: bridge

volumes:
  tripdb_data:
  identitydb_data:
  paymentdb_data:
  matchingdb_data:
  pgadmin_data:
  rabbitmq_data:
  portainer_data:
  grafana_data:
