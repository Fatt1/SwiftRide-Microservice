services:
  #database section
  tripdb:
    container_name: tripdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password@123
    ports:
      - "1435:1433"
    volumes:
      - tripdb_data:/var/opt/mssql

  identitydb:
    container_name: identitydb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password@123
    ports:
      - "1436:1433"
    volumes:
      - identitydb_data:/var/opt/mssql

  paymentdb:
    container_name: paymentdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password@123
      - POSTGRES_DB=swiftridedb
    ports:
      - "5433:5432"
    volumes:
      - paymentdb_data:/var/lib/postgresql

  matchingdb:
    container_name: matchingdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=Password@123
    ports:
      - "27017:27017"
    volumes:
      - matchingdb_data:/data/db


  #infrastructure section
  rabbitmq:
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq



  #microservice section
  identity.api:
    container_name: identity.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Server=identitydb,1433;Database=identitydb;User Id=sa;Password=Password@123;TrustServerCertificate=True;
      - EventBusSettings__HostAddress=rabbitmq
      - EventBusSettings__Port=5672
      - EventBusSettings__UserName=guest
      - EventBusSettings__Password=guest
      - OpenTelemetry__ServiceName=Identity.API
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "6001:5000"
    restart: on-failure
    depends_on:
      - identitydb
      - rabbitmq
      - jaeger

  trip.api:
    container_name: trip.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Server=tripdb,1433;Database=tripdb;User Id=sa;Password=Password@123;TrustServerCertificate=True;
      - EventBusSettings__HostAddress=rabbitmq
      - EventBusSettings__Port=5672
      - EventBusSettings__UserName=guest
      - EventBusSettings__Password=guest
      - GrpcSettings__MatchingUrl=http://matching.api:5004
      - OpenTelemetry__ServiceName=Trip.API
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "6002:5000"
    restart: on-failure
    depends_on:
      - tripdb
      - rabbitmq
      - jaeger
      - matching.api

  payment.api:
    container_name: payment.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Host=paymentdb;Port=5432;Database=swiftridedb;Username=postgres;Password=Password@123
      - EventBusSettings__HostAddress=rabbitmq
      - EventBusSettings__Port=5672
      - EventBusSettings__UserName=guest
      - EventBusSettings__Password=guest
      - OpenTelemetry__ServiceName=Payment.API
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "6005:5000"
    restart: on-failure
    depends_on:
      - paymentdb
      - rabbitmq
      - jaeger

  matching.api:
    container_name: matching.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Kestrel Endpoints (Port 5003: HTTP/1.1 REST, Port 5004: HTTP/2 gRPC)
      - Kestrel__Endpoints__HttpRest__Url=http://+:5003
      - Kestrel__Endpoints__GrpcEndpoint__Url=http://+:5004
      # MongoDB Settings
      - MongoDbSettings__ConnectionString=mongodb://root:Password%40123@matchingdb:27017/?authSource=admin
      - MongoDbSettings__DatabaseName=matchingdb
      # EventBus / RabbitMQ Settings
      - EventBusSettings__HostAddress=rabbitmq
      - EventBusSettings__Port=5672
      - EventBusSettings__UserName=guest
      - EventBusSettings__Password=guest
      # OpenTelemetry / Jaeger Settings
      - OpenTelemetry__ServiceName=Matching.API
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "6003:5003"
      - "6004:5004"
    depends_on:
      - matchingdb
      - rabbitmq
      - jaeger

  notification.api:
    container_name: notification.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - EventBusSettings__HostAddress=rabbitmq
      - EventBusSettings__Port=5672
      - EventBusSettings__UserName=guest
      - EventBusSettings__Password=guest
    ports:
      - "5006:5000"
      - "6006:5000"
    restart: on-failure
    depends_on:
      - rabbitmq

  yarpapigw:
    container_name: yarpapigw
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity.api:5000
      - ReverseProxy__Clusters__trip-cluster__Destinations__destination1__Address=http://trip.api:5000
      - ReverseProxy__Clusters__matching-cluster__Destinations__destination1__Address=http://matching.api:5003
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment.api:5000
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification.api:5000
    ports:
      - "5000:5000"
      - "6000:5000"
    restart: on-failure
    depends_on:
      - identity.api
      - trip.api
      - matching.api
      - payment.api
      - notification.api
