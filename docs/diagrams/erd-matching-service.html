<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matching Service · ER Data Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1140px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SWIFTRIDE · MATCHING SERVICE · DATA MODEL</p>
    <h1>Matching Service · Data Model</h1>
    <p class="subtitle">Polyglot Persistence: MongoDB (MatchingDB) · Geospatial 2dsphere Driver Indexing &amp; Dynamic Pricing Breakdown</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="matching-er-title matching-er-desc">
        <title id="matching-er-title">Matching Service Data Model</title>
        <desc id="matching-er-desc">Data model showing MatchSession aggregate root, DriverLocation geospatial collection, and embedded pricing and driver attempt documents in MatchingDB.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- RELATIONSHIP LINES (Drawn before boxes) -->

        <!-- 1. MatchSession — DriverLocation (0..1 : 1 Geo-Reference) -->
        <line x1="380" y1="140" x2="300" y2="140" stroke="#4f5d75" stroke-width="1"/>

        <!-- 2. MatchSession — DriverAttempt (1 : N Embedded Array) -->
        <line x1="380" y1="370" x2="300" y2="370" stroke="#4f5d75" stroke-width="1"/>

        <!-- 3. MatchSession — PricingBreakdown (1 : 1 Embedded Doc) -->

        <!-- 4. PricingBreakdown — AppliedSurge (1 : N Embedded Array) -->

        <!-- CARDINALITY & LABELS -->

        <!-- MatchSession -> DriverLocation -->
        <rect x="354" y="132" width="16" height="16" rx="2" fill="#f5f5f5"/>
        <text x="362" y="144" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="306" y="132" width="22" height="16" rx="2" fill="#f5f5f5"/>
        <text x="317" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..1</text>
        <rect x="318" y="120" width="44" height="13" rx="2" fill="#f5f5f5"/>
        <text x="340" y="129" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATCH</text>

        <!-- MatchSession -> DriverAttempt -->
        <rect x="354" y="362" width="16" height="16" rx="2" fill="#f5f5f5"/>
        <text x="362" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="310" y="362" width="16" height="16" rx="2" fill="#f5f5f5"/>
        <text x="318" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
        <rect x="320" y="350" width="40" height="13" rx="2" fill="#f5f5f5"/>
        <text x="340" y="359" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>

        <!-- MatchSession -> PricingBreakdown -->
        <rect x="682" y="152" width="16" height="16" rx="2" fill="#f5f5f5"/>
        <text x="690" y="164" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="722" y="152" width="16" height="16" rx="2" fill="#f5f5f5"/>
        <text x="730" y="164" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="690" y="140" width="40" height="13" rx="2" fill="#f5f5f5"/>
        <text x="710" y="149" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>

        <text x="887" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="880" y="324" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="887" y="335" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
